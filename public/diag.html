<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G|Wired connection test</title>
<style>body{font:16px -apple-system,sans-serif;background:#0a0a0a;color:#fff;padding:16px}pre{white-space:pre-wrap;background:#1b1b1d;padding:12px;border-radius:8px}button{font-size:18px;padding:12px 20px;border-radius:8px;border:0;background:#b01e1e;color:#fff}</style></head>
<body><h2>Connection test</h2><p>Tap the button, wait for it to finish, then screenshot the result.</p>
<button id="go">Run test</button><pre id="out">Not run yet</pre>
<script>
var SB='https://tfzrnazwvxyrjbrigyro.supabase.co';
var out=document.getElementById('out');
function log(s){out.textContent+='\n'+s}
async function t(name,fn){try{var r=await fn();log('OK   '+name+' -> '+r)}catch(e){log('FAIL '+name+' -> '+e.name+': '+e.message)}}
document.getElementById('go').onclick=async function(){
  out.textContent='Running...  '+navigator.userAgent;
  await t('1 same-site file',async function(){var r=await fetch('/manifest.webmanifest');return r.status});
  await t('2 Supabase plain GET (no headers)',async function(){var r=await fetch(SB+'/auth/v1/health');return r.status});
  await t('3 Supabase GET with apikey header',async function(){var r=await fetch(SB+'/auth/v1/health',{headers:{apikey:'x'}});return r.status});
  await t('4 Supabase POST json + apikey',async function(){var r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:'x','Content-Type':'application/json'},body:'{}'});return r.status});
  await t('5 other site GET (example.com no-cors)',async function(){var r=await fetch('https://example.com/',{mode:'no-cors'});return r.type});
  log('Done.')
};
</script></body></html>
